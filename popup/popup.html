<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 訂閱分組</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="popup-title">
      <img src="../icons/icon-48.png" alt="Logo" class="popup-title-icon" style="width: 20px; height: 20px; border-radius: 4px; object-fit: contain; vertical-align: middle; margin-right: 4px;" />
      <span>YouTube 訂閱分組</span>
    </div>
    <div class="popup-actions">
      <button class="icon-btn" id="btn-open-feed" title="開啟 YouTube 訂閱動態牆">📺</button>
      <button class="icon-btn" id="btn-open-options" title="管理分組與設定">⚙️</button>
    </div>
  </header>

  <div class="search-box-container">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 搜尋頻道或分組..." />
  </div>

  <div class="stats-bar">
    <span id="stats-text">載入中...</span>
    <div class="stats-Quick-toggle">
      <label class="watched-toggle-label" title="在動態牆自動隱藏已看過的影片">
        <input type="checkbox" id="chk-hide-watched" />
        <span>隱藏已觀看</span>
      </label>
      <label class="watched-toggle-label" title="在動態牆自動隱藏 Shorts 短片">
        <input type="checkbox" id="chk-hide-shorts" />
        <span>隱藏 Shorts</span>
      </label>
      <label class="watched-toggle-label" title="在動態牆僅顯示直播中影片">
        <input type="checkbox" id="chk-only-live" />
        <span>僅看直播</span>
      </label>
    </div>
  </div>

  <main class="folder-list-container" id="folder-list">
    <!-- Folder items rendered dynamically -->
  </main>

  <div class="popup-inline-add" id="popup-inline-add" style="display: none;">
    <input type="text" id="input-new-folder-name" class="popup-inline-input" placeholder="輸入新分組名稱 (例如: ☕ 晨間新聞)" maxlength="40" />
    <button type="button" class="btn-inline-submit" id="btn-submit-new-folder">建立</button>
    <button type="button" class="btn-inline-cancel" id="btn-cancel-new-folder">取消</button>
  </div>

  <footer class="popup-footer">
    <button class="btn-primary" id="btn-add-folder">
      <span>➕</span>
      <span>新增分組</span>
    </button>
    <button class="btn-secondary" id="btn-manage-all">
      <span>完整管理</span>
    </button>
  </footer>

  <script src="../scripts/initial_data.js"></script>
  <script src="../scripts/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
