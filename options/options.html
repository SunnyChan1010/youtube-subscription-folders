<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 訂閱分組管理 (Subscription Folders)</title>
  <link rel="stylesheet" href="../styles/options.css">
</head>
<body>
  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-brand">
      <img src="../icons/icon-48.png" alt="Logo" class="brand-icon" style="width: 34px; height: 34px; border-radius: 8px; object-fit: contain;" />
      <div>
        <div class="brand-title">YouTube 訂閱分組管理後台</div>
        <div class="brand-subtitle">快速分類頻道、建立自訂資料夾與備份管理</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-clean-duplicates" title="檢查並清理重複頻道，以已分類優先保留">
        <span>🧹</span>
        <span>清理重複</span>
      </button>
      <button class="btn btn-secondary" id="btn-export-backup" title="將所有分組與頻道匯出成備份檔案">
        <span>💾</span>
        <span>匯出備份 (JSON)</span>
      </button>
      <button class="btn btn-secondary" id="btn-import-backup" title="從備份檔案還原分組與頻道">
        <span>📥</span>
        <span>匯入備份</span>
      </button>
      <button class="btn btn-primary" id="btn-create-folder">
        <span>➕</span>
        <span>建立新分組</span>
      </button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="main-container">
    <!-- Left Sidebar: Folder List -->
    <aside class="folders-panel">
      <div class="panel-header">
        <span class="panel-title">我的分組清單</span>
        <span id="folder-count-badge" style="font-size: 12px; color: var(--text-secondary);">10 個分組</span>
      </div>
      <div class="folders-list" id="folders-list-el">
        <!-- Injected dynamically -->
      </div>
    </aside>

    <!-- Right Area: Channels in selected folder -->
    <section class="channels-panel">
      <div class="folder-details-header" id="folder-details-header">
        <div class="active-folder-title">
          <span class="active-folder-icon" id="header-folder-icon">📁</span>
          <div>
            <div class="active-folder-name" id="header-folder-name">選擇分組</div>
            <div class="active-folder-desc" id="header-folder-desc">點擊左側分組查看所屬頻道</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" id="btn-edit-active-folder">編輯此分組</button>
          <button class="btn btn-danger" id="btn-delete-active-folder">刪除分組</button>
        </div>
      </div>

      <div class="channel-toolbar">
        <input type="text" class="input-text" id="input-search-channels" placeholder="🔍 搜尋當前分組內的頻道..." />
        <input type="text" class="input-text" id="input-add-channel-handle" placeholder="➕ 輸入頻道 handle (例如 @mkbhd) 或 ID 加入此組" style="max-width: 380px;" />
        <button class="btn btn-primary" id="btn-add-channel-submit">加入頻道</button>
      </div>

      <div class="channels-grid-container">
        <div class="channels-grid" id="channels-grid-el">
          <!-- Channels list injected dynamically -->
        </div>
      </div>
    </section>
  </main>

  <!-- Folder Edit / Create Modal -->
  <div class="modal-overlay" id="folder-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-folder-title">建立新分組</div>
      <div class="form-group">
        <label class="form-label">分組名稱</label>
        <input type="text" class="input-text" id="modal-input-name" placeholder="例如: 🎮 電玩遊戲與實況" />
      </div>
      <div class="form-group">
        <label class="form-label">圖示 (Emoji 或文字)</label>
        <input type="text" class="input-text" id="modal-input-icon" placeholder="例如: 🎮、💻、🎵、⭐" maxlength="4" />
      </div>
      <div class="form-group">
        <label class="form-label">描述 / 標籤說明</label>
        <input type="text" class="input-text" id="modal-input-desc" placeholder="簡述此分組包含的內容主題..." />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-btn-cancel">取消</button>
        <button class="btn btn-primary" id="modal-btn-save">儲存</button>
      </div>
    </div>
  </div>

  <!-- Backup Import Modal -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-content" style="width: 520px;">
      <div class="modal-title">匯入分組備份 (JSON)</div>
      <div class="form-group">
        <label class="form-label">選擇本機 JSON 檔案</label>
        <input type="file" id="import-file-input" accept=".json" style="color: var(--text-secondary); margin-bottom: 8px;" />
      </div>
      <div class="form-group">
        <label class="form-label">或直接貼上備份 JSON 代碼</label>
        <textarea id="import-textarea" class="input-text" style="height: 100px; resize: vertical; font-family: monospace; font-size: 12px;" placeholder="{ &quot;folders&quot;: [...], &quot;channels&quot;: [...] }"></textarea>
      </div>
      <div class="form-group" style="gap: 8px; margin-top: 4px;">
        <label class="form-label">匯入方式</label>
        <div style="display: flex; gap: 20px; font-size: 13px;">
          <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="radio" name="import-mode" value="overwrite" checked />
            <span>覆蓋現有分組</span>
          </label>
          <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="radio" name="import-mode" value="merge" />
            <span>與現有分組合併</span>
          </label>
        </div>
      </div>
      <div class="form-group" style="gap: 8px; margin-top: 4px; padding: 10px 12px; background: rgba(255,255,255,0.04); border-radius: 8px; border: 1px solid var(--border);">
        <label class="form-label" style="color: #ff4d4f; font-weight: 600;">✨ 重複檢查與清理規則</label>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
          <input type="checkbox" id="import-opt-dedup-categorized" checked />
          <span>以已分類的頻道優先保留，自動刪除未分類之多餘重複項</span>
        </label>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
          <input type="checkbox" id="import-opt-single-folder" checked />
          <span>嚴格單一分組模式（若頻道出現在多個分組，僅保留於首個分組）</span>
        </label>
      </div>
      <div class="form-group" style="gap: 8px; margin-top: 4px; padding: 10px 12px; background: rgba(33, 150, 243, 0.08); border-radius: 8px; border: 1px solid rgba(33, 150, 243, 0.25);">
        <label class="form-label" style="color: #2196f3; font-weight: 600;">🔔 訂閱狀態比對與自動訂閱</label>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
          <input type="checkbox" id="import-opt-auto-subscribe" checked />
          <span>比對現有訂閱：若備份內包含未訂閱的頻道，自動加入分組並同步加入 YouTube 訂閱</span>
        </label>
      </div>
      <div class="form-group" style="gap: 8px; margin-top: 4px; padding: 10px 12px; background: rgba(255, 77, 79, 0.08); border-radius: 8px; border: 1px solid rgba(255, 77, 79, 0.25);">
        <label class="form-label" style="color: #ff4d4f; font-weight: 600;">⚠️ 檢查已刪除頻道與取消訂閱</label>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer;">
          <input type="checkbox" id="import-opt-check-unsubscribed" checked />
          <span>檢查已刪除頻道：若目前仍訂閱但備份中已沒有該頻道，詢問是否取消訂閱</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="import-btn-cancel">取消</button>
        <button class="btn btn-primary" id="import-btn-confirm">確認匯入</button>
      </div>
    </div>
  </div>

  <!-- Unsubscribe Confirmation Modal -->
  <div class="modal-overlay" id="unsubscribe-confirm-modal">
    <div class="modal-content" style="width: 580px; max-height: 85vh; display: flex; flex-direction: column;">
      <div class="modal-title" style="color: #ff4d4f; display: flex; align-items: center; gap: 8px;">
        <span>⚠️ 取消訂閱確認</span>
      </div>
      <div style="font-size: 13.5px; color: var(--text-primary); line-height: 1.5;">
        檢測到以下頻道在您目前的 YouTube 帳號中仍處於「已訂閱」狀態，但<strong>匯入的備份資料中已不存在（或已刪除）</strong>。<br />
        請勾選您希望同步<strong>取消訂閱</strong>的頻道：
      </div>

      <div class="unsub-toolbar">
        <div style="display: flex; gap: 8px; align-items: center;">
          <button type="button" class="btn btn-secondary btn-xs" id="unsub-btn-select-all">全選</button>
          <button type="button" class="btn btn-secondary btn-xs" id="unsub-btn-deselect-all">取消全選</button>
        </div>
        <div id="unsub-selected-counter" style="font-size: 12.5px; color: var(--text-secondary);">
          已選擇 0 個頻道
        </div>
      </div>

      <div class="unsub-channels-list" id="unsub-channels-list">
        <!-- Dynamically injected channel items -->
      </div>

      <div class="modal-actions" style="margin-top: 12px; justify-content: space-between;">
        <button class="btn btn-secondary" id="unsub-modal-btn-skip">略過（保留所有訂閱）</button>
        <button class="btn btn-primary" id="unsub-modal-btn-confirm" style="background: #e53935; border-color: #d32f2f;">確認取消所選訂閱 (0)</button>
      </div>
    </div>
  </div>

  <!-- Auto-Subscribe Progress Modal -->
  <div class="modal-overlay" id="subscribe-progress-modal">
    <div class="modal-content" style="width: 480px; text-align: center;">
      <div class="modal-title" id="progress-modal-title">🔔 正在同步 YouTube 訂閱</div>
      <div style="font-size: 14px; margin: 12px 0 6px; color: var(--text-primary); font-weight: 500;" id="progress-modal-channel-name">正在比對訂閱狀態...</div>
      <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;" id="progress-modal-counter">準備中...</div>
      
      <!-- Progress Bar Track -->
      <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; margin-bottom: 20px;">
        <div id="progress-modal-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #2196f3, #4caf50); border-radius: 5px; transition: width 0.3s ease;"></div>
      </div>

      <div style="display: flex; justify-content: center; gap: 12px;">
        <button class="btn btn-secondary" id="progress-modal-btn-cancel">中斷訂閱</button>
      </div>
    </div>
  </div>

  <script src="../scripts/initial_data.js"></script>
  <script src="../scripts/storage.js"></script>
  <script src="../scripts/youtube_api.js"></script>
  <script src="options.js"></script>
</body>
</html>
